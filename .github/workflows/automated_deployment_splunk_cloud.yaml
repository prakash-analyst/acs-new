name: Automated Deployment to Splunk Cloud

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: splunk-cloud-deploy
  cancel-in-progress: false

env:
  acs_endpoint: admin.splunk.com

jobs:

  validate_stack_and_acs_credentials_configured:
    runs-on: self-hosted
    steps:
      - name: Check STACK_NAME is set as a GitHub Secret
        env:
          stack_name: ${{ secrets.STACK_NAME }}
        run: |
          if [[ "${stack_name}" == "" ]]
          then
            echo "[Error] - The Secret for STACK_NAME is not set in GitHub Secrets"
            exit 1
          fi
      - name: Check STACK_TOKEN is set as a GitHub Secret
        env:
          stack_auth_token: ${{ secrets.STACK_TOKEN }}
        run: |
          if [[ "${stack_auth_token}" == "" ]]
          then
            echo "[Error] - The Secret for STACK_TOKEN is not set in GitHub Secrets"
            exit 1
          fi

  validate_splunkbase_credentials_configured:
    runs-on: self-hosted
    steps:
      - name: Check SPLUNKBASE_USERNAME is set as a GitHub Secret
        env:
          splunkbase_username: ${{ secrets.SPLUNKBASE_USERNAME }}
        run: |
          if [[ "${splunkbase_username}" == "" ]]
          then
            echo "[Error] - The Secret for SPLUNKBASE_USERNAME is not set in GitHub Secrets"
            exit 1
          fi
      - name: Check SPLUNKBASE_PASSWORD is set as a GitHub Secret
        env:
          splunkbase_password: ${{ secrets.SPLUNKBASE_PASSWORD }}
        run: |
          if [[ "${splunkbase_password}" == "" ]]
          then
            echo "[Error] - The Secret for SPLUNKBASE_PASSWORD is not set in GitHub Secrets"
            exit 1
          fi

  authenticate_with_splunk:
    outputs:
      splunkapi_auth_token: ${{ steps.auth-splunk-api.outputs.api_auth_token }}
      splunkbase_auth_token: ${{ steps.authenticate-splunkbase.outputs.auth_token }}
    needs: [validate_splunkbase_credentials_configured, validate_stack_and_acs_credentials_configured]
    runs-on: self-hosted
    steps:
      - name: authenticate with splunkbase
        id: authenticate-splunkbase
        env:
          splunkbase_user: ${{ secrets.SPLUNKBASE_USERNAME }}
          splunkbase_password: ${{ secrets.SPLUNKBASE_PASSWORD }}
        run: |
          splunkbase_token=$(curl -sX POST --form "username=\"${splunkbase_user}\"" --form "password=\"${splunkbase_password}\"" 'https://splunkbase.splunk.com/api/account:login'| sed -ne 's/.*<id>\(.*\)<\/id>/\1/p')
          if [[ ${splunkbase_token} == "" ]]
          then
            echo "token: ${splunkbase_token}"
            exit 1
          else
            echo "auth_token=$(echo ${splunkbase_token})" >> $GITHUB_OUTPUT
          fi
      - name: Authenticate with splunk API service
        id: auth-splunk-api
        env:
          splunkbase_user: ${{ secrets.SPLUNKBASE_USERNAME }}
          splunkbase_password: ${{ secrets.SPLUNKBASE_PASSWORD }}
        run: |
          splunk_api_session=$(curl -s -k -u ${splunkbase_user}:${splunkbase_password} --url "https://api.splunk.com/2.0/rest/login/splunk")
          if [[ $(echo ${splunk_api_session} | jq ".status_code") -eq 200 ]]
          then
            echo "[success] - Obtained Auth Token from Splunk API service"
            echo "${splunk_api_session}"
          else
            echo "[failed] - Something happened that resulted in a non-200 response"
            echo "${splunk_api_session}"
            exit 1
          fi
          api_auth_token=$(echo ${splunk_api_session} | jq -r '.data.token'|base64 -w 0)
          echo "${api_auth_token}"
          echo "api_auth_token=${api_auth_token}" >> $GITHUB_OUTPUT

  private_app_management:
    needs: [authenticate_with_splunk]
    runs-on: self-hosted
    steps:
      - name: Check out repo code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          clean: true
      - name: Reset working directories
        run: |
          rm -rf /tmp/privateApps /tmp/privatePackages /tmp/appinspect_failures /tmp/jq
          mkdir -p /tmp/privateApps /tmp/privatePackages /tmp/appinspect_failures /tmp/jq
      - name: Write AppInspect report parsers
        run: |
          cat > /tmp/jq/blocking.jq <<'JQEOF'
          .reports[].groups[].checks[]
          | select(.result == "failure" or .result == "error")
          | "  [" + (.result | ascii_upcase) + "] " + .name,
            "        " + ((.description // "") | gsub("[[:space:]]+"; " ")),
            (.messages[]? | "        -> " + ((.filename // "n/a") | tostring) + ":" + ((.line // "n/a") | tostring) + " " + ((.message // "") | gsub("[[:space:]]+"; " ")))
          JQEOF
          cat > /tmp/jq/manual.jq <<'JQEOF'
          .reports[].groups[].checks[]
          | select(.result == "manual_check")
          | "  [MANUAL] " + .name,
            (.messages[]? | "        -> " + ((.message // "") | gsub("[[:space:]]+"; " ")))
          JQEOF
      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v47
        with:
          files: |
            privateApps/**
      - name: Identify Private Apps with Changes in git
        if: ${{ steps.changed-files.outputs.any_changed == 'true' }}
        env:
          modified_files: ${{ steps.changed-files.outputs.all_modified_files }}
        run: |
          appsToVet=$(for modifiedFile in ${modified_files}; do echo ${modifiedFile} | grep "privateApps" | awk -F\/ '{print $2}'; done | sort -u)
          echo "[Scope] - apps with changes in this commit:"
          for app in ${appsToVet}
          do
            echo "  ${app}"
            cp -rp privateApps/${app} /tmp/privateApps
          done
      - name: Append commit hash to app version
        if: ${{ steps.changed-files.outputs.any_changed == 'true' }}
        env:
          commit_sha: ${{ github.sha }}
        run: |
          commit_short="${commit_sha:0:7}"
          for appconf in $(find /tmp/privateApps -type f -name app.conf)
          do
            base=$(sed -n 's/^version[[:space:]]*=[[:space:]]*\([0-9][0-9.]*\).*/\1/p' "${appconf}" | head -1)
            if [[ -z "${base}" ]]
            then
              echo "[Error] - no numeric version found in ${appconf}"
              exit 1
            fi
            new_version="${base}+${commit_short}"
            sed -i -e "s/^version[[:space:]]*=.*/version = ${new_version}/" "${appconf}"
            echo "[Version] - ${appconf} -> ${new_version}"
          done
      - name: Check for local directories
        if: ${{ steps.changed-files.outputs.any_changed == 'true' }}
        run: |
          if [[ $(find /tmp/privateApps -type d -name local | wc -l) -gt 0 ]]
          then
            echo "Local Directories Present"
            exit 1
          fi
      - name: Package Apps for validation
        if: ${{ steps.changed-files.outputs.any_changed == 'true' }}
        run: |
          cd /tmp/privateApps
          for app in $(find . -maxdepth 1 -type d | sed 's/^\.\///g' | tail -n +2)
          do
            app_version=$(sed -n 's/^version[[:space:]]*=[[:space:]]*\(.*\)/\1/p' "${app}/default/app.conf" | head -1 | tr '.+' '__')
            echo "[Package] - ${app} -> ${app}_${app_version}.tgz"
            COPYFILE_DISABLE=1 tar -czf "/tmp/privatePackages/${app}_${app_version}.tgz" "${app}"
          done
      - name: Run Apps through App Inspect
        if: ${{ steps.changed-files.outputs.any_changed == 'true' }}
        env:
          appinspect_token: ${{ needs.authenticate_with_splunk.outputs.splunkapi_auth_token }}
          allow_manual_check: 'true'
        run: |
          appinspect_token=$(echo "${appinspect_token}" | base64 -d)
          cd /tmp/privatePackages
          overall_rc=0
          for candidateApp in $(ls *.tgz 2>/dev/null)
          do
            echo "::group::[AppInspect] ${candidateApp}"
            AppRequest=$(curl -sX POST 'https://appinspect.splunk.com/v1/app/validate' \
              --header "Authorization: Bearer ${appinspect_token}" \
              --header "Cache-Control: no-cache" \
              --form "app_package=@\"${candidateApp}\"" \
              --form 'included_tags="private_app"')
            requestURL=$(echo "${AppRequest}" | jq -r '.links[]? | select(.rel=="status") | .href' 2>/dev/null || echo "")
            reportURL=$(echo "${AppRequest}" | jq -r '.links[]? | select(.rel=="report") | .href' 2>/dev/null || echo "")
            if [[ -z "${requestURL}" || "${requestURL}" == "null" ]]
            then
              echo "[Error] - Submission rejected for ${candidateApp}"
              echo "${AppRequest}"
              overall_rc=1
              echo "::endgroup::"
              continue
            fi
            appInspectStatus=$(curl -sX GET "https://appinspect.splunk.com${requestURL}" --header "Authorization: Bearer ${appinspect_token}")
            LOOPCOUNTER=0
            while [[ $(echo "${appInspectStatus}" | jq -r '.status' 2>/dev/null || echo UNKNOWN) == "PROCESSING" && ${LOOPCOUNTER} -lt 60 ]]
            do
              sleep 15
              appInspectStatus=$(curl -sX GET "https://appinspect.splunk.com${requestURL}" --header "Authorization: Bearer ${appinspect_token}")
              LOOPCOUNTER=$((LOOPCOUNTER+1))
            done
            if [[ ${LOOPCOUNTER} -eq 60 ]]
            then
              echo "[Error] - Timeout occurred validating ${candidateApp}"
              overall_rc=1
              echo "::endgroup::"
              continue
            fi
            if [[ $(echo "${appInspectStatus}" | jq -r '.status' 2>/dev/null || echo UNKNOWN) != "SUCCESS" ]]
            then
              echo "[Error] - Appinspect went to unknown state while validating ${candidateApp}"
              echo "${appInspectStatus}"
              overall_rc=1
              echo "::endgroup::"
              continue
            fi
            errors=$(echo "${appInspectStatus}" | jq -r '.info.error // 0')
            failures=$(echo "${appInspectStatus}" | jq -r '.info.failure // 0')
            manuals=$(echo "${appInspectStatus}" | jq -r '.info.manual_check // 0')
            echo "[Summary] ${candidateApp} :: error=${errors} failure=${failures} manual_check=${manuals}"
            reportFile="/tmp/appinspect_failures/${candidateApp}.json"
            curl -sX GET "https://appinspect.splunk.com${reportURL}" \
              --header "Authorization: Bearer ${appinspect_token}" \
              --header "Accept: application/json" > "${reportFile}"
            if [[ ${failures} -gt 0 || ${errors} -gt 0 ]]
            then
              echo "[Error] - ${candidateApp} has blocking findings:"
              jq -r -f /tmp/jq/blocking.jq "${reportFile}" || echo "  [Warn] - could not render findings"
              overall_rc=1
            fi
            if [[ ${manuals} -gt 0 ]]
            then
              echo "[Notice] - ${candidateApp} has ${manuals} manual check(s):"
              jq -r -f /tmp/jq/manual.jq "${reportFile}" || echo "  [Warn] - could not render manual checks"
              if [[ "${allow_manual_check}" != "true" ]]
              then
                overall_rc=1
              fi
            fi
            if [[ ${errors} -eq 0 && ${failures} -eq 0 ]]
            then
              rm -f "${reportFile}"
            fi
            echo "::endgroup::"
          done
          exit ${overall_rc}
      - name: 'Upload AppInspect Failures'
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: appInspectFailureReports
          path: /tmp/appinspect_failures/
          if-no-files-found: ignore
          retention-days: 5
      - name: Install or Upgrade Apps
        if: ${{ steps.changed-files.outputs.any_changed == 'true' }}
        env:
          stack: ${{ secrets.STACK_NAME }}
          stack_jwt: ${{ secrets.STACK_TOKEN }}
          acs: ${{ env.acs_endpoint }}
          appinspect_token: ${{ needs.authenticate_with_splunk.outputs.splunkapi_auth_token }}
        run: |
          appinspect_token=$(echo "${appinspect_token}" | base64 -d)
          cd /tmp/privatePackages
          deploy_rc=0
          for candidateApp in $(ls *.tgz 2>/dev/null)
          do
            echo "[ACS] - Installing ${candidateApp} to ${stack} via ${acs}"
            http_code=$(curl -s -o /tmp/acs_install_response.json -w '%{http_code}' \
              -X POST "https://${acs}/${stack}/adminconfig/v2/apps/victoria" \
              --header "X-Splunk-Authorization: ${appinspect_token}" \
              --header "Authorization: Bearer ${stack_jwt}" \
              --header 'ACS-Legal-Ack: Y' \
              --data-binary "@${candidateApp}")
            echo "[ACS] - HTTP ${http_code}"
            cat /tmp/acs_install_response.json
            echo ""
            if [[ "${http_code}" != "200" && "${http_code}" != "201" && "${http_code}" != "202" ]]
            then
              echo "[Error] - ACS rejected ${candidateApp}"
              deploy_rc=1
            fi
          done
          rm -f /tmp/acs_install_response.json
          exit ${deploy_rc}
      - name: Clean up working directories
        if: always()
        run: |
          rm -rf /tmp/privateApps /tmp/privatePackages /tmp/jq