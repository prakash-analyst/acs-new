name: Automated Deployment to Splunk Cloud

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: splunk-cloud-deploy
  cancel-in-progress: false

env:
  acs_endpoint: admin.splunk.com

jobs:

  validate_stack_and_acs_credentials_configured:
    runs-on: self-hosted
    steps:
      - name: Check STACK_NAME is set as a GitHub Secret
        env:
          stack_name: ${{ secrets.STACK_NAME }}
        run: |
          if [[ "${stack_name}" == "" ]]
          then
            echo "[Error] - The Secret for STACK_NAME is not set in GitHub Secrets"
            exit 1
          fi
      - name: Check STACK_TOKEN is set as a GitHub Secret
        env:
          stack_auth_token: ${{ secrets.STACK_TOKEN }}
        run: |
          if [[ "${stack_auth_token}" == "" ]]
          then
            echo "[Error] - The Secret for STACK_TOKEN is not set in GitHub Secrets"
            exit 1
          fi

  validate_splunkbase_credentials_configured:
    runs-on: self-hosted
    steps:
      - name: Check SPLUNKBASE_USERNAME is set as a GitHub Secret
        env:
          splunkbase_username: ${{ secrets.SPLUNKBASE_USERNAME }}
        run: |
          if [[ "${splunkbase_username}" == "" ]]
          then
            echo "[Error] - The Secret for SPLUNKBASE_USERNAME is not set in GitHub Secrets"
            exit 1
          fi
      - name: Check SPLUNKBASE_PASSWORD is set as a GitHub Secret
        env:
          splunkbase_password: ${{ secrets.SPLUNKBASE_PASSWORD }}
        run: |
          if [[ "${splunkbase_password}" == "" ]]
          then
            echo "[Error] - The Secret for SPLUNKBASE_PASSWORD is not set in GitHub Secrets"
            exit 1
          fi

  authenticate_with_splunk:
    outputs:
      splunkapi_auth_token: ${{ steps.auth-splunk-api.outputs.api_auth_token }}
      splunkbase_auth_token: ${{ steps.authenticate-splunkbase.outputs.auth_token }}
    needs: [validate_splunkbase_credentials_configured, validate_stack_and_acs_credentials_configured]
    runs-on: self-hosted
    steps:
      - name: authenticate with splunkbase
        id: authenticate-splunkbase
        env:
          splunkbase_user: ${{ secrets.SPLUNKBASE_USERNAME }}
          splunkbase_password: ${{ secrets.SPLUNKBASE_PASSWORD }}
        run: |
          splunkbase_token=$(curl -sX POST --form "username=\"${splunkbase_user}\"" --form "password=\"${splunkbase_password}\"" 'https://splunkbase.splunk.com/api/account:login'| sed -ne 's/.*<id>\(.*\)<\/id>/\1/p')
          if [[ ${splunkbase_token} == "" ]]
          then
            echo "token: ${splunkbase_token}"
            exit 1
          else
            echo "auth_token=$(echo ${splunkbase_token})" >> $GITHUB_OUTPUT
          fi
      - name: Authenticate with splunk API service
        id: auth-splunk-api
        env:
          splunkbase_user: ${{ secrets.SPLUNKBASE_USERNAME }}
          splunkbase_password: ${{ secrets.SPLUNKBASE_PASSWORD }}
        run: |
          splunk_api_session=$(curl -s -k -u ${splunkbase_user}:${splunkbase_password} --url "https://api.splunk.com/2.0/rest/login/splunk")
          if [[ $(echo ${splunk_api_session} | jq ".status_code") -eq 200 ]]
          then
            echo "[success] - Obtained Auth Token from Splunk API service"
            echo "${splunk_api_session}"
          else
            echo "[failed] - Something happened that resulted in a non-200 response"
            echo "${splunk_api_session}"
            exit 1
          fi
          api_auth_token=$(echo ${splunk_api_session} | jq -r '.data.token'|base64 -w 0)
          echo "${api_auth_token}"
          echo "api_auth_token=${api_auth_token}" >> $GITHUB_OUTPUT

  private_app_management:
    needs: [authenticate_with_splunk]
    runs-on: self-hosted
    steps:
      - name: Check out repo code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          clean: true
      - name: Verify required tooling
        run: |
          missing=""
          for tool in curl jq tar git base64 sed awk grep find python3 xxd
          do
            if ! command -v ${tool} >/dev/null 2>&1
            then
              missing="${missing} ${tool}"
            fi
          done
          if [[ -n "${missing}" ]]
          then
            echo "[Error] - missing tooling on runner ${RUNNER_NAME}:${missing}"
            exit 1
          fi
          tar --version | head -1
          jq --version
          python3 --version
      - name: Ensure slim is available
        run: |
          if command -v slim >/dev/null 2>&1
          then
            echo "[slim] - already installed"
            slim --version || true
            exit 0
          fi
          echo "[slim] - not found, attempting user install"
          python3 -m pip install --user splunk-packaging-toolkit || true
          export PATH="${HOME}/.local/bin:${PATH}"
          echo "${HOME}/.local/bin" >> $GITHUB_PATH
          if command -v slim >/dev/null 2>&1
          then
            echo "[slim] - installed"
            slim --version || true
          else
            echo "[Error] - slim is required for packaging and is not installed"
            echo "          Install it once on this runner with:"
            echo "          pip3 install splunk-packaging-toolkit"
            exit 1
          fi
      - name: Reset working directories
        run: |
          rm -rf /tmp/privateApps /tmp/privatePackages /tmp/appinspect_failures /tmp/jq /tmp/current_private_apps.json
          mkdir -p /tmp/privateApps /tmp/privatePackages /tmp/appinspect_failures /tmp/jq
      - name: Write AppInspect report parsers
        run: |
          cat > /tmp/jq/blocking.jq <<'JQEOF'
          .reports[].groups[].checks[]
          | select(.result == "failure" or .result == "error")
          | "  [" + (.result | ascii_upcase) + "] " + .name,
            "        " + ((.description // "") | gsub("[[:space:]]+"; " ")),
            (.messages[]? | "        -> " + ((.filename // "n/a") | tostring) + ":" + ((.line // "n/a") | tostring) + " " + ((.message // "") | gsub("[[:space:]]+"; " ")))
          JQEOF
          cat > /tmp/jq/manual.jq <<'JQEOF'
          .reports[].groups[].checks[]
          | select(.result == "manual_check")
          | "  [MANUAL] " + .name,
            (.messages[]? | "        -> " + ((.message // "") | gsub("[[:space:]]+"; " ")))
          JQEOF
          echo "--- blocking.jq ---"
          cat /tmp/jq/blocking.jq
          echo "--- manual.jq ---"
          cat /tmp/jq/manual.jq
      - name: Gather installed private apps from stack
        env:
          stack: ${{ secrets.STACK_NAME }}
          stack_jwt: ${{ secrets.STACK_TOKEN }}
          acs: ${{ env.acs_endpoint }}
        run: |
          http_code=$(curl -s -o /tmp/current_private_apps.json -w '%{http_code}' \
            "https://${acs}/${stack}/adminconfig/v2/apps/victoria?count=100" \
            --header "Authorization: Bearer ${stack_jwt}")
          echo "[ACS] - GET apps/victoria returned ${http_code} from ${acs}"
          if [[ "${http_code}" != "200" ]]
          then
            echo "[Error] - ACS did not return 200. Response body:"
            cat /tmp/current_private_apps.json
            exit 1
          fi
          if ! jq -e '.apps' /tmp/current_private_apps.json >/dev/null 2>&1
          then
            echo "[Error] - ACS response has no .apps array"
            cat /tmp/current_private_apps.json
            exit 1
          fi
          jq -r '.apps[] | "  installed: " + .name + " version " + (.version // "unknown")' /tmp/current_private_apps.json
      - name: 'Upload Current Private Apps'
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: current_private_apps.json
          path: /tmp/current_private_apps.json
          if-no-files-found: warn
          retention-days: 5
      - name: Fresh Install App Deploy
        id: fresh-install-app-deploy
        env:
          stack: ${{ secrets.STACK_NAME }}
        run: |
          deployExisting=false
          installed=$(jq -r '.apps[].name' /tmp/current_private_apps.json)
          for app in $(ls privateApps | grep -v "README.md")
          do
            if [[ ! "${installed}" =~ "${app}" ]]
            then
              echo "${app} not present on target"
              cp -rp privateApps/${app} /tmp/privateApps
              deployExisting=true
            fi
          done
          echo "deployExisting=${deployExisting}" >> $GITHUB_OUTPUT
          echo "${deployExisting}"
      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v47
        with:
          files: |
            privateApps/**
      - name: Identify Private Apps with Changes in git
        if: ${{ steps.changed-files.outputs.any_changed == 'true' }}
        env:
          modified_files: ${{ steps.changed-files.outputs.all_modified_files }}
        run: |
          appsToVet=$(for modifiedFile in ${modified_files}; do echo ${modifiedFile} | grep "privateApps" | awk -F\/ '{print $2}'; done | uniq)
          for app in ${appsToVet}
          do
            cp -rp privateApps/${app} /tmp/privateApps
          done
          echo "---"
          ls -l /tmp/privateApps
      - name: Normalise conf file encoding
        if: ${{ (steps.changed-files.outputs.any_changed == 'true') || (steps.fresh-install-app-deploy.outputs.deployExisting == 'true') }}
        run: |
          for conf in $(find /tmp/privateApps -type f -name '*.conf')
          do
            if grep -q $'\r' "${conf}"
            then
              echo "[Fix] - stripping CR from ${conf}"
              sed -i 's/\r$//' "${conf}"
            fi
            if [[ $(head -c 3 "${conf}" | xxd -p) == "efbbbf" ]]
            then
              echo "[Fix] - stripping UTF-8 BOM from ${conf}"
              sed -i '1s/^\xEF\xBB\xBF//' "${conf}"
            fi
            if [[ -n $(tail -c 1 "${conf}") ]]
            then
              echo "[Fix] - adding trailing newline to ${conf}"
              echo "" >> "${conf}"
            fi
          done
      - name: Set deterministic app version
        if: ${{ (steps.changed-files.outputs.any_changed == 'true') || (steps.fresh-install-app-deploy.outputs.deployExisting == 'true') }}
        env:
          run_number: ${{ github.run_number }}
          commit_sha: ${{ github.sha }}
        run: |
          for appconf in $(find /tmp/privateApps -type f -name app.conf)
          do
            base=$(sed -n 's/^version[[:space:]]*=[[:space:]]*\([0-9][0-9.]*\).*/\1/p' "${appconf}" | head -1)
            if [[ -z "${base}" ]]
            then
              echo "[Error] - no numeric version found in ${appconf}"
              exit 1
            fi
            major=$(echo "${base}" | cut -d. -f1)
            minor=$(echo "${base}" | cut -d. -f2)
            if [[ -z "${minor}" ]]
            then
              minor=0
            fi
            new_version="${major}.${minor}.${run_number}"
            sed -i -e "s/^version[[:space:]]*=.*/version = ${new_version}/" "${appconf}"
            echo "[Version] - ${appconf} -> ${new_version}"
            echo "---"
            cat "${appconf}"
          done
          echo "run ${run_number} corresponds to commit ${commit_sha}" >> $GITHUB_STEP_SUMMARY
      - name: Check for local directories
        if: ${{ (steps.changed-files.outputs.any_changed == 'true') || (steps.fresh-install-app-deploy.outputs.deployExisting == 'true') }}
        run: |
          if [[ $(find /tmp/privateApps -type d -name local | wc -l) -gt 0 ]]
          then
            echo "Local Directories Present"
            exit 1
          fi
      - name: Strip junk files before packaging
        if: ${{ (steps.changed-files.outputs.any_changed == 'true') || (steps.fresh-install-app-deploy.outputs.deployExisting == 'true') }}
        run: |
          find /tmp/privateApps -name '.DS_Store' -print -delete
          find /tmp/privateApps -name '__MACOSX' -type d -print -exec rm -rf {} +
          find /tmp/privateApps -name '*.pyc' -print -delete
          find /tmp/privateApps -name '__pycache__' -type d -print -exec rm -rf {} +
      - name: Show app.conf metadata
        if: ${{ (steps.changed-files.outputs.any_changed == 'true') || (steps.fresh-install-app-deploy.outputs.deployExisting == 'true') }}
        run: |
          for appconf in $(find /tmp/privateApps -type f -name app.conf)
          do
            echo "::group::${appconf}"
            grep -n '^\[' "${appconf}" || echo "  [Warn] - no stanza headers found"
            echo "  --- full contents ---"
            cat -A "${appconf}" | head -40
            echo "::endgroup::"
          done
      - name: Validate and package apps with slim
        if: ${{ (steps.changed-files.outputs.any_changed == 'true') || (steps.fresh-install-app-deploy.outputs.deployExisting == 'true') }}
        run: |
          cd /tmp/privateApps
          pkg_rc=0
          for app in $(find . -maxdepth 1 -type d | sed 's/^\.\///g' | tail -n +2)
          do
            echo "::group::[slim] ${app}"
            if [[ ! -f "${app}/default/app.conf" ]]
            then
              echo "[Error] - ${app} has no default/app.conf"
              pkg_rc=1
              echo "::endgroup::"
              continue
            fi
            if ! slim validate "${app}"
            then
              echo "[Error] - slim validate failed for ${app}"
              pkg_rc=1
              echo "::endgroup::"
              continue
            fi
            if ! slim package -o /tmp/privatePackages "${app}"
            then
              echo "[Error] - slim package failed for ${app}"
              pkg_rc=1
            fi
            echo "::endgroup::"
          done
          echo "--- packages produced ---"
          ls -l /tmp/privatePackages || true
          if [[ ${pkg_rc} -ne 0 ]]
          then
            echo "[Error] - one or more apps failed slim validation or packaging"
            exit 1
          fi
          if [[ -z "$(ls -A /tmp/privatePackages 2>/dev/null)" ]]
          then
            echo "[Error] - slim produced no packages"
            exit 1
          fi
      - name: Show package locations
        if: always()
        run: |
          echo "whoami        : $(whoami)"
          echo "workspace     : ${GITHUB_WORKSPACE}"
          echo "runner name   : ${RUNNER_NAME}"
          echo "runner temp   : ${RUNNER_TEMP}"
          echo "resolved /tmp : $(cd /tmp && pwd -P)"
          echo "mount for /tmp:"
          findmnt -T /tmp || true
          echo "--- /tmp/privatePackages ---"
          ls -la /tmp/privatePackages/ 2>/dev/null || echo "no privatePackages dir"
          echo "--- /tmp/privateApps ---"
          ls -la /tmp/privateApps/ 2>/dev/null || echo "no privateApps dir"
      - name: 'Upload built packages for inspection'
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: privatePackages
          path: |
            /tmp/privatePackages/*.tar.gz
            /tmp/privatePackages/*.tgz
          if-no-files-found: warn
          retention-days: 5
      - name: Inspect packages
        if: ${{ (steps.changed-files.outputs.any_changed == 'true') || (steps.fresh-install-app-deploy.outputs.deployExisting == 'true') }}
        run: |
          python3 - <<'PYEOF'
          import glob, re, sys, tarfile
          rc = 0
          pkgs = sorted(glob.glob('/tmp/privatePackages/*.tar.gz') + glob.glob('/tmp/privatePackages/*.tgz'))
          if not pkgs:
              print('[Error] - no packages found')
              sys.exit(1)
          ver_re = re.compile(r'^\d+\.\d+\.\d+$')
          for pkg in pkgs:
              print('[Inspect] ' + pkg)
              try:
                  tf = tarfile.open(pkg, 'r:gz')
              except Exception as exc:
                  print('  [Error] - cannot open as gzip tar: %s' % exc)
                  rc = 1
                  continue
              names = tf.getnames()
              print('  entries: %d' % len(names))
              tops = set(n.split('/')[0] for n in names if n not in ('.', ''))
              tops.discard('.')
              if len(tops) != 1:
                  print('  [Error] - expected one top-level dir, found: %s' % sorted(tops))
                  rc = 1
                  tf.close()
                  continue
              app = tops.pop()
              print('  top-level dir: %s' % app)
              conf_path = app + '/default/app.conf'
              if conf_path not in names:
                  print('  [Error] - missing %s' % conf_path)
                  rc = 1
                  tf.close()
                  continue
              blob = tf.extractfile(conf_path).read()
              if blob.startswith(b'\xef\xbb\xbf'):
                  print('  [Error] - app.conf begins with UTF-8 BOM')
                  rc = 1
              raw = blob.decode('utf-8', 'replace')
              if '\r' in raw:
                  print('  [Error] - app.conf contains CR characters')
                  rc = 1
              stanza = None
              conf = {}
              for line in raw.splitlines():
                  s = line.strip()
                  if not s or s.startswith('#'):
                      continue
                  if s.startswith('[') and s.endswith(']'):
                      stanza = s[1:-1]
                      conf.setdefault(stanza, {})
                      continue
                  if '=' not in s or stanza is None:
                      continue
                  k, v = s.split('=', 1)
                  conf[stanza][k.strip()] = v.strip()
              print('  stanzas: %s' % sorted(conf.keys()))
              id_name = conf.get('id', {}).get('name')
              id_ver = conf.get('id', {}).get('version')
              pkg_id = conf.get('package', {}).get('id')
              launcher_ver = conf.get('launcher', {}).get('version')
              print('  [id] name      = %s' % id_name)
              print('  [id] version   = %s' % id_ver)
              print('  [package] id   = %s' % pkg_id)
              print('  [launcher] ver = %s' % launcher_ver)
              if not id_name and not pkg_id:
                  print('  [Error] - no [id] name or [package] id to identify the app')
                  rc = 1
              if id_name and id_name != app:
                  print('  [Error] - [id] name "%s" != dir "%s"' % (id_name, app))
                  rc = 1
              if pkg_id and pkg_id != app:
                  print('  [Error] - [package] id "%s" != dir "%s"' % (pkg_id, app))
                  rc = 1
              vers = set(v for v in (id_ver, launcher_ver) if v)
              if not vers:
                  print('  [Error] - no version in [id] or [launcher]')
                  rc = 1
              for v in vers:
                  if not ver_re.match(v):
                      print('  [Error] - version "%s" is not major.minor.patch' % v)
                      rc = 1
              if len(vers) > 1:
                  print('  [Error] - conflicting versions: %s' % sorted(vers))
                  rc = 1
              for n in names:
                  if '/local/' in n or n.endswith('/local'):
                      print('  [Error] - local path present: %s' % n)
                      rc = 1
                  if n.split('/')[-1] == '.DS_Store' or '__MACOSX' in n:
                      print('  [Error] - junk path present: %s' % n)
                      rc = 1
              tf.close()
          sys.exit(rc)
          PYEOF
      - name: Run Apps through App Inspect
        if: ${{ (steps.changed-files.outputs.any_changed == 'true') || (steps.fresh-install-app-deploy.outputs.deployExisting == 'true') }}
        env:
          stack: ${{ secrets.STACK_NAME }}
          stack_jwt: ${{ secrets.STACK_TOKEN }}
          appinspect_token: ${{ needs.authenticate_with_splunk.outputs.splunkapi_auth_token }}
          allow_manual_check: 'true'
        run: |
          appinspect_token=$(echo "${appinspect_token}" | base64 -d)
          cd /tmp/privatePackages
          overall_rc=0
          for candidateApp in $(ls *.tar.gz *.tgz 2>/dev/null)
          do
            echo "::group::[AppInspect] ${candidateApp}"
            AppRequest=$(curl -sX POST 'https://appinspect.splunk.com/v1/app/validate' \
              --header "Authorization: Bearer ${appinspect_token}" \
              --header "Cache-Control: no-cache" \
              --form "app_package=@\"${candidateApp}\"" \
              --form 'included_tags="private_app"')
            echo "${AppRequest}"
            requestURL=$(echo "${AppRequest}" | jq -r '.links[]? | select(.rel=="status") | .href' 2>/dev/null || echo "")
            reportURL=$(echo "${AppRequest}" | jq -r '.links[]? | select(.rel=="report") | .href' 2>/dev/null || echo "")
            if [[ -z "${requestURL}" || "${requestURL}" == "null" ]]
            then
              echo "[Error] - Submission rejected for ${candidateApp}"
              overall_rc=1
              echo "::endgroup::"
              continue
            fi
            appInspectStatus=$(curl -sX GET "https://appinspect.splunk.com${requestURL}" --header "Authorization: Bearer ${appinspect_token}")
            LOOPCOUNTER=0
            while [[ $(echo "${appInspectStatus}" | jq -r '.status' 2>/dev/null || echo UNKNOWN) == "PROCESSING" && ${LOOPCOUNTER} -lt 60 ]]
            do
              sleep 15
              appInspectStatus=$(curl -sX GET "https://appinspect.splunk.com${requestURL}" --header "Authorization: Bearer ${appinspect_token}")
              LOOPCOUNTER=$((LOOPCOUNTER+1))
            done
            if [[ ${LOOPCOUNTER} -eq 60 ]]
            then
              echo "[Error] - Timeout occurred validating ${candidateApp}"
              overall_rc=1
              echo "::endgroup::"
              continue
            fi
            if [[ $(echo "${appInspectStatus}" | jq -r '.status' 2>/dev/null || echo UNKNOWN) != "SUCCESS" ]]
            then
              echo "[Error] - Appinspect went to unknown state while validating ${candidateApp}"
              echo "${appInspectStatus}"
              overall_rc=1
              echo "::endgroup::"
              continue
            fi
            errors=$(echo "${appInspectStatus}" | jq -r '.info.error // 0')
            failures=$(echo "${appInspectStatus}" | jq -r '.info.failure // 0')
            manuals=$(echo "${appInspectStatus}" | jq -r '.info.manual_check // 0')
            echo "[Summary] ${candidateApp} :: error=${errors} failure=${failures} manual_check=${manuals}"
            reportFile="/tmp/appinspect_failures/${candidateApp}.json"
            curl -sX GET "https://appinspect.splunk.com${reportURL}" \
              --header "Authorization: Bearer ${appinspect_token}" \
              --header "Accept: application/json" > "${reportFile}"
            if ! jq -e '.reports' "${reportFile}" >/dev/null 2>&1
            then
              echo "[Warn] - Report for ${candidateApp} is not parseable JSON, raw head follows:"
              head -c 2000 "${reportFile}"
              echo ""
            else
              if [[ ${failures} -gt 0 || ${errors} -gt 0 ]]
              then
                echo "[Error] - ${candidateApp} has blocking findings:"
                jq -r -f /tmp/jq/blocking.jq "${reportFile}" || echo "  [Warn] - could not render findings for ${candidateApp}"
              fi
              if [[ ${manuals} -gt 0 ]]
              then
                echo "[Notice] - ${candidateApp} has ${manuals} manual check(s):"
                jq -r -f /tmp/jq/manual.jq "${reportFile}" || echo "  [Warn] - could not render manual checks for ${candidateApp}"
              fi
            fi
            if [[ ${errors} -gt 0 || ${failures} -gt 0 ]]
            then
              overall_rc=1
            fi
            if [[ ${manuals} -gt 0 && "${allow_manual_check}" != "true" ]]
            then
              overall_rc=1
            fi
            if [[ ${errors} -eq 0 && ${failures} -eq 0 ]]
            then
              rm -f "${reportFile}"
            fi
            echo "::endgroup::"
          done
          exit ${overall_rc}
      - name: 'Upload AppInspect Failures'
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: appInspectFailureReports
          path: /tmp/appinspect_failures/
          if-no-files-found: ignore
          retention-days: 5
      - name: Install or Upgrade Apps
        if: ${{ (steps.changed-files.outputs.any_changed == 'true') || (steps.fresh-install-app-deploy.outputs.deployExisting == 'true') }}
        env:
          stack: ${{ secrets.STACK_NAME }}
          stack_jwt: ${{ secrets.STACK_TOKEN }}
          acs: ${{ env.acs_endpoint }}
          appinspect_token: ${{ needs.authenticate_with_splunk.outputs.splunkapi_auth_token }}
        run: |
          appinspect_token=$(echo "${appinspect_token}" | base64 -d)
          cd /tmp/privatePackages
          deploy_rc=0
          for candidateApp in $(ls *.tar.gz *.tgz 2>/dev/null)
          do
            echo "[ACS] - Installing ${candidateApp} to ${stack} via ${acs}"
            http_code=$(curl -s -o /tmp/acs_install_response.json -w '%{http_code}' \
              -X POST "https://${acs}/${stack}/adminconfig/v2/apps/victoria" \
              --header "X-Splunk-Authorization: ${appinspect_token}" \
              --header "Authorization: Bearer ${stack_jwt}" \
              --header 'ACS-Legal-Ack: Y' \
              --header 'Content-Type: application/octet-stream' \
              --data-binary "@${candidateApp}")
            echo "[ACS] - HTTP ${http_code}"
            cat /tmp/acs_install_response.json
            echo ""
            if [[ "${http_code}" != "200" && "${http_code}" != "201" && "${http_code}" != "202" ]]
            then
              echo "[Error] - ACS rejected ${candidateApp}"
              deploy_rc=1
            fi
          done
          rm -f /tmp/acs_install_response.json
          exit ${deploy_rc}
      - name: Clean up working directories
        if: always()
        run: |
